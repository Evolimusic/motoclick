{% extends "dashboard_base.html" %}

{% block panel_content %}
<div class="header-flex">
    <h1 style="font-size: 26px; color: #212529; font-weight: bold; margin: 0;">Crear Registro de Usuario</h1>
    <a href="{% url 'listar_usuarios' %}" class="btn-click-outline" style="border-radius: 50px; padding: 10px 20px;">
        Volver al Listado
    </a>
</div>

<div class="card-custom">
    <form method="POST">
        {% csrf_token %}
        
        <!-- Recorremos todos los campos del usuario (Nombres, Apellidos, Contraseña, etc.) -->
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <span style="color: red; font-size: 12px;">{{ field.errors|striptags }}</span>
                {% endif %}
            </div>
        {% endfor %}
        
        <div style="text-align: right; margin-top: 25px;">
            <button type="submit" class="btn-click-primary" style="width: 200px;">
                GUARDAR REGISTRO
            </button>
        </div>
    </form>
</div>
{% endblock %}
