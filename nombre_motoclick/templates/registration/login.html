<!-- nombre_motoclick/templates/registration/login.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motoclick - Iniciar Sesión</title>
</head>
<body style="background-color: #f4f4f4; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <div style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px;">
        <h2 style="color: #c82333; text-align: center; margin-bottom: 20px;">Motoclick APP</h2>
        
        <!-- Mensaje en caso de que pongan mal las credenciales -->
        {% if form.errors %}
            <p style="color: red; font-size: 14px; text-align: center; font-weight: bold;">Usuario o contraseña incorrectos.</p>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-weight: bold; color: #333;">Usuario:</label>
                <!-- Django genera el input automáticamente y lo inyecta aquí de forma segura -->
                {{ form.username }} 
            </div>
            
            <div style="margin-bottom: 20px;">
                <label style="display:block; margin-bottom:5px; font-weight: bold; color: #333;">Contraseña:</label>
                {{ form.password }}
            </div>

            <button type="submit" style="background-color: #d85268; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px;">
                ENTRAR
            </button>
        </form>
    </div>

</body>
</html>
