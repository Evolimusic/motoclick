{% extends 'base.html' %}
{% block content %}
<!-- Evitamos que el menú superior pise el título de la página dándole margin-top -->
<div class="container" style="margin-top: 160px; margin-bottom: 60px;">
    
    <div class="row mb-4">
        <div class="col-12 text-center">
            <h2 class="font-weight-bold" style="color: #1a1a1a;">📍 Mapa de Talleres Autorizados</h2>
            <p class="text-muted">Visualiza en tiempo real los centros de servicio técnico y mano de obra para tu motocicleta.</p>
            <hr style="border-top: 2px solid #ff3366; width: 100px; margin: 20px auto;">
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-10">
            <!-- CONTENEDOR DE LA TARJETA DEL MAPA -->
            <div class="card shadow border-0 p-2" style="border-radius: 15px; background-color: #f8f9fa;">
                
                <!-- CORRECCIÓN CLAVE: Usamos iframe para incrustar el HTML interactivo del mapa de Folium -->
                <div style="border-radius: 12px; overflow: hidden; height: 500px; width: 100%;">
                    <iframe src="{% url 'ver_mapa' %}?render_map=true" 
                            style="border: none; width: 100%; height: 100%; min-height: 500px;" 
                            allowfullscreen>
                    </iframe>
                </div>

            </div>
        </div>
    </div>

</div>
{% endblock %}
